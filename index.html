<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>הולך בדרכי — סיפור חיים, יעקב קבלה</title>
<meta name="description" content="הולך בדרכי — סיפור חייו של יעקב קבלה. ספר לדפדוף."/>
<meta name="robots" content="noindex, nofollow"/>
<meta property="og:title" content="הולך בדרכי — סיפור חיים"/>
<meta property="og:description" content="סיפור חייו של יעקב קבלה"/>
<meta property="og:type" content="book"/>
<meta name="theme-color" content="#eeeeee"/>
<!-- Sets the dark-mode class before any CSS paints, so a saved/system dark
     preference never flashes light first. Kept tiny and synchronous
     (blocking) on purpose - this must run before the stylesheet below
     applies, not deferred to the bottom-of-body script like the rest of
     the app's JS. -->
<script>
(function(){
  try {
    var saved = localStorage.getItem('hb_theme');
    var dark = saved ? saved === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>
<!-- page-flip is vendored locally (vendor/page-flip.browser.js) rather than
     fetched from unpkg.com, since a corporate network/security policy blocking
     that CDN silently breaks the whole reader: St.PageFlip never initialises,
     the boot sequence throws mid-way, and no chrome or bottom bar ever renders. -->
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    /* Measured off the live reference at 1440x900: the backdrop SVG is drawn with
       background-size:cover, so only its middle band shows. Rendered corners are
       TL 247, TR 229, BL 232, BR 223 - a shallow ~143deg ramp, not the SVG's own
       #c3c3c3->#fff. Reading the SVG source instead of the pixels gives a
       backdrop roughly three times too contrasty. */
    background:linear-gradient(143deg,#f7f7f7 0%,#efefef 35%,#e6e6e6 70%,#dedede 100%);
    color:#2a2a2a;overflow:hidden;direction:rtl;
    font-family:"Segoe UI","Arial Hebrew",Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* The reference's backdrop ramps smoothly corner to corner with no bright band,
     so this stays very faint - a strong sheen was an earlier misreading. */
  #glow{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:linear-gradient(118deg,
      rgba(255,255,255,0) 30%, rgba(255,255,255,.10) 46%,
      rgba(255,255,255,.10) 54%, rgba(255,255,255,0) 70%);
  }

  /* ---------------- floating chrome cards ---------------- */
  /* Heyzine's panels are flat translucent white with a small radius and no
     shadow; an opaque card with a drop shadow reads far more "material". */
  .card{
    position:fixed;z-index:30;background:rgba(255,255,255,.85);border-radius:5px;
    box-shadow:none;
  }
  #titlecard{top:12px;right:12px;padding:.6rem .95rem;max-width:min(46vw,420px)}
  #titlecard h1{font-size:1.02rem;font-weight:600;margin:0;color:#1c1c1c;line-height:1.3}
  #titlecard .sub{display:block;font-size:.78rem;color:#767676;margin-top:.12rem}

  #tools{top:12px;left:12px;display:flex;align-items:center;gap:.1rem;padding:.3rem}
  .ico{
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border:0;background:transparent;border-radius:8px;cursor:pointer;color:#3c3c3c;
    transition:background .15s,color .15s;padding:0;
  }
  .ico:hover{background:#f0f0f0;color:#000}
  .ico:active{background:#e6e6e6}
  .ico:disabled{opacity:.3;cursor:default;background:transparent}
  .ico svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;
           stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #zlabel{font-size:.72rem;color:#8a8a8a;min-width:2.6rem;text-align:center;
          font-variant-numeric:tabular-nums;user-select:none}

  /* edition switch, in the title card */
  .seg{display:inline-flex;gap:2px;margin-top:.5rem;padding:2px;border-radius:8px;background:#f1f1f1}
  .seg button{
    font:inherit;font-size:.74rem;padding:.26rem .62rem;cursor:pointer;
    border:0;background:transparent;color:#6a6a6a;border-radius:6px;transition:.15s;
  }
  .seg button.on{background:#2f2f2f;color:#fff}
  .seg button:hover:not(.on){color:#1c1c1c;background:#e4e4e4}
  /* Font-size icons for the edition toggle: the Hebrew letter aleph at two
     sizes reads instantly as "regular vs. large text" without needing the
     Hebrew words spelled out - the same "Aa" convention reading apps use,
     just in-script for a book that's entirely in Hebrew. */
  .seg .szico{font-weight:600;line-height:1;display:inline-block}
  .seg .szico.sm{font-size:.72rem}
  .seg .szico.lg{font-size:1.22rem}

  /* ---------------- stage ---------------- */
  #stage{
    position:absolute;inset:0 0 64px 0;z-index:1;overflow:hidden;
    display:flex;align-items:center;justify-content:center;padding:6px;
    perspective:2600px;perspective-origin:50% 45%;
  }
  #stage.zoomed{overflow:auto;cursor:grab}
  #stage.zoomed:active{cursor:grabbing}

  /* Heyzine's real edge arrows (measured directly off their live reader via
     DOM inspection, not guessed): 32x32, bare icon with NO circular button,
     no background, no shadow, no border - just the glyph, positioned near
     the BOTTOM of the book (~5px above its bottom edge), not vertical-middle
     as an earlier pass here wrongly assumed. Exact measured values: button
     rect bottom sits 5px above the book's own bottom edge; horizontal gap
     from the book's left/right edge to the button is 10px either side. */
  .edgebtn{
    position:absolute;bottom:5px;z-index:20;width:32px;height:32px;
    border:0;cursor:pointer;background:transparent;color:#3c3c3c;
    display:flex;align-items:center;justify-content:center;
    box-shadow:none;transition:opacity .15s;
  }
  .edgebtn:hover{color:#000}
  .edgebtn:active{color:#000}
  .edgebtn.hide{opacity:0;pointer-events:none}
  .edgebtn svg{width:22px;height:22px;fill:none;stroke:currentColor;
               stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* Heyzine's own reply-arrow glyph, traced from their sprite (iconset2_6.png),
     used for the edge buttons and the corner-peel hint so both match. "next"
     (left edge, forward) mirrors the same path used for "prev" (right edge). */
  .edgebtn.flip svg, .peelarrow.flip svg{transform:scaleX(-1)}

  /* Corner-peel hint. This used to be our own static triangular fold+icon
     (the only corner hint back when StPageFlip's built-in one was disabled
     - see showPageCorners in the JS below for that whole saga). Now that
     showPageCorners is re-enabled and StPageFlip draws its own real,
     dynamically-sized animated fold at each corner, this static div would
     render UNDERNEATH/inside that fold at the same time - two different
     hint shapes overlapping messily rather than one clean hint. Forcing
     opacity 0 unconditionally (regardless of the .show class the JS below
     still toggles) retires the visual without touching the proximity JS or
     the onclick-to-flip handlers on these divs, which still work as an
     invisible click target. */
  .peel{
    position:absolute;width:34px;height:34px;z-index:21;cursor:pointer;
    overflow:hidden;opacity:0!important;transition:none;
  }
  .peel.show{opacity:0!important}
  .peel.hide{display:none}
  .peel::before{
    content:'';position:absolute;width:48px;height:48px;
    background:linear-gradient(135deg,#fff 0%,#fff 46%,#d8d8d8 47%,#f4f4f4 60%,#fff 100%);
    box-shadow:-2px 2px 6px rgba(0,0,0,.22);
  }
  /* default = right-side (prev) corner */
  .peel::before{bottom:-14px;right:-14px;transform:rotate(45deg)}
  .peel.top::before{top:-14px;right:-14px;bottom:auto;transform:rotate(-45deg)}
  /* .pn = left-side (next) corner: mirror the triangle to the opposite edge */
  .peel.pn::before{right:auto;left:-14px;transform:rotate(-45deg)}
  .peel.pn.top::before{right:auto;left:-14px;transform:rotate(45deg)}
  .peelarrow{
    position:absolute;bottom:2px;right:2px;width:16px;height:16px;
    color:#8a8a8a;pointer-events:none;
  }
  .peel.pn .peelarrow{right:auto;left:2px}
  .peelarrow svg{width:100%;height:100%;fill:none;stroke:currentColor;
                 stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #zoomwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
            transition:transform .22s cubic-bezier(.2,.8,.3,1);
            transform-origin:center center;will-change:transform}
  /* scaleX(-1) turns the LTR engine into an RTL book; the translate slides a
     lone cover/back page into the middle of the viewport, Heyzine-style.
     Both have to live on this one element: wrapping #book in a positioning
     div makes StPageFlip's autoSize width:100% collapse to a single page. */
  #book{transform:scaleX(-1);position:relative;z-index:3;
        transition:transform .42s cubic-bezier(.25,.85,.3,1);will-change:transform}
  #book.nofx{transition:none}
  #book img{transform:scaleX(-1);width:100%;height:100%;display:block}
  .page{background:#fff;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,.2)}
  /* Heyzine has no page-edge stack; the reference book sits as two clean sheets.
     Kept out of the DOM entirely rather than hidden, so layout() stays cheap. */
  #spreadfx{
    position:absolute;z-index:2;pointer-events:none;
    box-shadow:0 0 20px rgba(0,0,0,.2);
  }
  #contact{
    position:absolute;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.20) 0%, rgba(0,0,0,.09) 45%, rgba(0,0,0,0) 74%);
    filter:blur(14px);pointer-events:none;z-index:0;
  }
  #gutter{
    position:absolute;pointer-events:none;z-index:4;
    background:linear-gradient(to right,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.13) 42%, rgba(0,0,0,.20) 50%,
      rgba(0,0,0,.13) 58%, rgba(0,0,0,0) 100%);
    mix-blend-mode:multiply;opacity:.85;
  }

  /* ---------------- bottom scrubber ---------------- */
  #bottom{
    position:fixed;left:0;right:0;bottom:0;height:64px;z-index:30;
    display:flex;align-items:center;justify-content:center;gap:.55rem;
    padding:0 14px;pointer-events:none;
  }
  #bottom>*{pointer-events:auto}
  #nav{display:flex;align-items:center;gap:.1rem;background:#fff;border-radius:10px;
       padding:.24rem;box-shadow:0 1px 4px rgba(0,0,0,.14)}
  #counter{font-size:.78rem;color:#4a4a4a;min-width:8.6rem;text-align:center;
           font-variant-numeric:tabular-nums;user-select:none}
  #scrub{
    -webkit-appearance:none;appearance:none;background:transparent;
    width:min(46vw,520px);height:24px;margin:0;direction:rtl;cursor:pointer;
  }
  #scrub::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#c9c9c9}
  #scrub::-moz-range-track{height:6px;border-radius:3px;background:#c9c9c9}
  #scrub::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:52px;height:10px;border-radius:5px;
    background:#4d4d4d;border:0;margin-top:-2px;box-shadow:0 1px 3px rgba(0,0,0,.28);
  }
  #scrub::-moz-range-thumb{
    width:52px;height:10px;border-radius:5px;background:#4d4d4d;border:0;
    box-shadow:0 1px 3px rgba(0,0,0,.28);
  }
  #scrub:focus{outline:none}

  /* Scrub preview: Heyzine shows the destination spread as two thumbnails above
     the slider while you drag. Sizes are theirs, mirrored for an RTL book. */
  #scrubprev{
    position:fixed;bottom:91px;z-index:31;display:none;
    background:rgba(0,0,0,.2);border-radius:4px;padding:10px;
    gap:0;pointer-events:none;
  }
  #scrubprev.on{display:flex}
  #scrubprev img{width:92px;height:130px;display:block;background:#fff;object-fit:cover}
  #scrubprev .lbl{
    position:absolute;left:0;right:0;bottom:-30px;text-align:center;
    font-size:15px;font-weight:300;color:#fff;background:rgba(0,0,0,.4);
    border-radius:2px;padding:0 14px;line-height:1.55;
  }

  /* ---------------- loader ---------------- */
  #load{position:fixed;inset:0;z-index:60;
        background:linear-gradient(135deg,#fefefe,#e4e4e4);
        display:flex;align-items:center;justify-content:center;flex-direction:column;
        gap:1.1rem;transition:opacity .5s}
  #load.done{opacity:0;pointer-events:none}
  #load p{font-size:.86rem;color:#8a8a8a;margin:0;letter-spacing:.02em}
  #pbar{width:190px;height:2px;background:rgba(0,0,0,.10);border-radius:2px;overflow:hidden}
  #pbar i{display:block;height:100%;width:0;border-radius:2px;
          background:linear-gradient(90deg,#9a9a9a,#4a4a4a);transition:width .25s}

  /* ---------------- dark mode ----------------
     Only the chrome (backdrop, floating cards, bottom bar, loader) switches
     to a dark palette - the book pages themselves (JPEGs of a real printed
     page) stay their natural white/paper colour, same as a real paper book
     doesn't change colour when the room lights dim. Inverting the page
     images would also wreck the ~22 photos in this memoir; leaving them
     alone is both simpler and more correct. Toggled via .dark on <html>,
     see toggleTheme()/applyTheme() in the script below. */
  html.dark body{
    background:linear-gradient(143deg,#2b2b2b 0%,#242424 35%,#1c1c1c 70%,#151515 100%);
    color:#d8d8d8;
  }
  html.dark .card{background:rgba(32,32,32,.85)}
  html.dark #titlecard h1{color:#eee}
  html.dark #titlecard .sub{color:#9a9a9a}
  html.dark .ico{color:#c9c9c9}
  html.dark .ico:hover{background:#3a3a3a;color:#fff}
  html.dark .ico:active{background:#454545}
  html.dark #zlabel{color:#9a9a9a}
  html.dark .seg{background:#3a3a3a}
  html.dark .seg button{color:#aaa}
  html.dark .seg button.on{background:#eee;color:#1c1c1c}
  html.dark .seg button:hover:not(.on){color:#eee;background:#484848}
  /* Bare icon, no chrome (see .edgebtn above) - only the icon colour needs
     to flip for dark mode, there's no background/shadow to restyle. */
  html.dark .edgebtn{color:#d8d8d8}
  html.dark .edgebtn:hover{color:#fff}
  html.dark .edgebtn:active{color:#fff}
  html.dark #nav{background:#242424;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  html.dark #counter{color:#bbb}
  html.dark #scrub::-webkit-slider-runnable-track{background:#4a4a4a}
  html.dark #scrub::-moz-range-track{background:#4a4a4a}
  html.dark #scrub::-webkit-slider-thumb{background:#d8d8d8;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  html.dark #scrub::-moz-range-thumb{background:#d8d8d8;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  html.dark #load{background:linear-gradient(135deg,#242424,#161616)}
  html.dark #load p{color:#9a9a9a}
  html.dark #pbar{background:rgba(255,255,255,.12)}
  html.dark #pbar i{background:linear-gradient(90deg,#666,#ccc)}

  @media (max-width:760px){
    #titlecard{padding:.45rem .7rem;max-width:56vw}
    #titlecard h1{font-size:.86rem}
    #titlecard .sub{display:none}
    .seg button{padding:.22rem .46rem;font-size:.68rem}
    #tools{padding:.2rem}
    .ico{width:34px;height:34px}
    #zlabel,#zoomout,#zoomin{display:none}
    #stage{inset:0 0 56px 0;padding:4px}
    #bottom{height:56px;gap:.3rem}
    #counter{min-width:6.2rem;font-size:.7rem}
    #scrub{width:34vw}
  }
</style>
</head>
<body>

<div id="glow"></div>

<div id="load">
  <p>טוען את הספר…</p>
  <div id="pbar"><i></i></div>
</div>

<div class="card" id="titlecard">
  <h1>הולך בדרכי</h1>
  <span class="sub">סיפור חיים — יעקב קבלה</span>
  <div class="seg">
    <button id="ed-regular" class="on" onclick="setEdition('regular')" title="גופן רגיל" aria-label="גופן רגיל"><span class="szico sm">א</span></button>
    <button id="ed-large" onclick="setEdition('large')" title="גופן גדול" aria-label="גופן גדול"><span class="szico lg">א</span></button>
  </div>
</div>

<div class="card" id="tools">
  <button class="ico" id="zoomout" onclick="zoomBy(-1)" title="הקטן" aria-label="הקטן">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
  </button>
  <span id="zlabel">100%</span>
  <button class="ico" id="zoomin" onclick="zoomBy(1)" title="הגדל" aria-label="הגדל">
    <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg>
  </button>
  <button class="ico" onclick="toggleFullscreen()" title="מסך מלא" aria-label="מסך מלא">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <button class="ico" id="sndbtn" onclick="toggleSound()" title="צליל דפדוף" aria-label="צליל דפדוף">
    <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="wv1" d="M16.5 8.8a4.5 4.5 0 0 1 0 6.4"/><path id="wv2" d="M19 6.3a8 8 0 0 1 0 11.4"/><path id="mute" d="M17 9.5l5 5m0-5l-5 5" style="display:none"/></svg>
  </button>
  <button class="ico" id="themebtn" onclick="toggleTheme()" title="מצב כהה" aria-label="מצב כהה">
    <svg viewBox="0 0 24 24" id="theme-sun"><circle cx="12" cy="12" r="4.3"/><path d="M12 3v2.4M12 18.6V21M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M3 12h2.4M18.6 12H21M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
    <svg viewBox="0 0 24 24" id="theme-moon" style="display:none"><path d="M20.4 14.7A8.6 8.6 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1z"/></svg>
  </button>
</div>

<div id="stage">
  <div id="zoomwrap">
    <div id="contact"></div>
    <div id="spreadfx"></div>
    <div id="book"></div>
    <div id="gutter"></div>
    <div class="peel pn" id="peelNextB" onclick="nextPage()"><span class="peelarrow flip"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></span></div>
    <div class="peel pn top" id="peelNextT" onclick="nextPage()"></div>
    <div class="peel" id="peelPrevB" onclick="prevPage()"><span class="peelarrow"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></span></div>
    <div class="peel top" id="peelPrevT" onclick="prevPage()"></div>
    <button class="edgebtn" id="edgePrev" onclick="prevPage()" title="עמוד קודם" aria-label="עמוד קודם">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="edgebtn flip" id="edgeNext" onclick="nextPage()" title="עמוד הבא" aria-label="עמוד הבא">
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
  </div>
</div>

<div id="bottom">
  <div id="nav">
    <button class="ico" id="btnPrev" onclick="prevPage()" title="עמוד קודם" aria-label="עמוד קודם">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span id="counter">—</span>
    <button class="ico" id="btnNext" onclick="nextPage()" title="עמוד הבא" aria-label="עמוד הבא">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </div>
  <input id="scrub" type="range" min="1" max="1" value="1" step="1" aria-label="מעבר לעמוד"/>
</div>

<div id="scrubprev"><img id="spL" alt=""/><img id="spR" alt=""/><span class="lbl"></span></div>

<script src="vendor/page-flip.browser.js"></script>

var edition = 'regular';
var flip = null, total = 0, zoom = 1, PW = 0, portrait = false;
var stage = document.getElementById('stage');
var wrap = document.getElementById('zoomwrap');

/* ---------------- page-turn sound ---------------- */
var sndOn = true, sndPool = [], sndIdx = 0;
try { sndOn = localStorage.getItem('hb_snd') !== '0'; } catch (e) {}

function paintSndIcon() {
  var show = sndOn ? '' : 'none';
  document.getElementById('wv1').style.display = show;
  document.getElementById('wv2').style.display = show;
  document.getElementById('mute').style.display = sndOn ? 'none' : '';
}

function initSound() {
  ['sm', 'md', 'lg'].forEach(function (k) {
    for (var i = 0; i < 2; i++) {          // two of each so quick flips overlap
      var a = new Audio(SOUNDS[k]);
      a.preload = 'auto'; a.volume = 0.10;   // Heyzine plays these at 0.1
      sndPool.push(a);
    }
  });
  paintSndIcon();
}

function playFlip() {
  if (!sndOn || !sndPool.length) return;
  var a = sndPool[sndIdx % sndPool.length];
  sndIdx++;
  try { a.currentTime = 0; a.play().catch(function () {}); } catch (e) {}
}

function toggleSound() {
  sndOn = !sndOn;
  paintSndIcon();
  try { localStorage.setItem('hb_snd', sndOn ? '1' : '0'); } catch (e) {}
  if (sndOn) playFlip();
}

/* ---------------- theme ----------------
   The actual .dark class was already set (or not) by the tiny blocking
   script in <head>, before this deferred script even runs, to avoid a
   flash of the wrong theme. This just keeps the icon/aria-label in sync
   with whatever state that early script left us in, and handles clicks. */
function paintThemeIcon(dark) {
  document.getElementById('theme-sun').style.display = dark ? 'none' : '';
  document.getElementById('theme-moon').style.display = dark ? '' : 'none';
  var btn = document.getElementById('themebtn');
  var label = dark ? 'מצב בהיר' : 'מצב כהה';
  btn.title = label; btn.setAttribute('aria-label', label);
}
function toggleTheme() {
  var dark = !document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark', dark);
  paintThemeIcon(dark);
  try { localStorage.setItem('hb_theme', dark ? 'dark' : 'light'); } catch (e) {}
}
paintThemeIcon(document.documentElement.classList.contains('dark'));

function srcs(ed) {
  var n = EDITIONS[ed].pages, out = [];
  for (var i = 1; i <= n; i++)
    out.push('images/' + ed + '/page_' + String(i).padStart(3, '0') + '.jpg');
  return out;
}

function warm(list, count, done) {
  var left = Math.min(count, list.length), loaded = 0;
  if (!left) return done();
  for (var i = 0; i < left; i++) {
    var im = new Image();
    im.onload = im.onerror = function () {
      loaded++;
      document.querySelector('#pbar i').style.width = (loaded / left * 100) + '%';
      if (loaded >= left) done();
    };
    im.src = list[i];
  }
}

function build(startPage) {
  var el = document.getElementById('book');
  el.innerHTML = '';
  var list = srcs(edition);
  total = list.length;

  var availW = stage.clientWidth - 12, availH = stage.clientHeight - 12;
  var ratio = 240 / 170;
  var single = availW < 815;
  var w, h;
  if (single) {
    w = availW; h = w * ratio;
    if (h > availH) { h = availH; w = h / ratio; }
  } else {
    h = availH; w = h / ratio;
    if (w * 2 > availW) { w = availW / 2; h = w * ratio; }
  }
  w = Math.floor(w); h = Math.floor(h);
  PW = w;

  list.forEach(function (src, i) {
    var d = document.createElement('div');
    d.className = 'page';
    if (i === 0 || i === list.length - 1) d.setAttribute('data-density', 'hard');
    var im = document.createElement('img');
    im.src = src; im.alt = 'עמוד ' + (i + 1);
    im.loading = i < 6 ? 'eager' : 'lazy';
    im.draggable = false;
    d.appendChild(im);
    el.appendChild(d);
  });

  flip = new St.PageFlip(el, {
    width: w, height: h,
    size: 'fixed',
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.8,
    flippingTime: 780,
    mobileScrollSupport: false,
    swipeDistance: 24,
    drawShadow: true,
    /* StPageFlip has its OWN built-in "hover near a corner" animated fold
       preview (userMove() -> showCorner()), gated by showPageCorners
       (default true). This used to be mirrored wrong - and so did the real
       drag-to-flip direction - because #book is rendered with
       transform:scaleX(-1) for RTL, but the library's own getMousePos()
       (vendor/page-flip.browser.js, patched in-place - see the file's
       header comment) naively did clientX-rect.left with no knowledge of
       that mirror. Both bugs (mirrored hover AND mirrored real flip
       direction) shared that one root cause. Now that getMousePos() itself
       is patched to un-mirror real pointer coordinates, showPageCorners can
       be safely re-enabled - StPageFlip's animated hover-lift now computes
       correctly and looks like a real page-corner lift, instead of our
       static icon-only .peel hint standing in for it. Keep both: the .peel
       divs still supply the custom arrow-icon/shadow styling layered on
       top, but the actual lift animation is StPageFlip's own now. */
    showPageCorners: true
  });
  flip.loadFromHTML(el.querySelectorAll('.page'));
  flip.on('flip', function () { sync(); });
  flip.on('changeState', function (e) { if (e.data === 'flipping') playFlip(); });

  var s = document.getElementById('scrub');
  s.min = 1; s.max = total;

  if (startPage && startPage > 1 && startPage <= total) flip.turnToPage(startPage - 1);

  el.classList.add('nofx');           // no glide when the book is (re)built
  sync();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { el.classList.remove('nofx'); });
  });
}

/* Pages that render alone: the cover, and the back cover when the count is even.
   StPageFlip pairs them as [0] [1,2] [3,4] ... so the tail is alone iff total is even. */
function aloneAt(i) {
  if (portrait) return false;
  return i === 0 || (i === total - 1 && total % 2 === 0);
}

/* Heyzine centres a lone page in the viewport instead of parking it in one half
   of the two-page block, so slide the whole assembly by half a page. */
function offsetFor(i) {
  if (portrait) return 0;
  if (i === 0) return PW / 2;                                  // cover sits left  -> push right
  if (i === total - 1 && total % 2 === 0) return -PW / 2;       // back sits right -> push left
  return 0;
}

function sync() { updateCounter(); layout(); }

function layout() {
  if (!flip) return;
  portrait = !!(flip.getOrientation && flip.getOrientation() === 'portrait');
  var el = document.getElementById('book');
  var bw = el.offsetWidth, bh = el.offsetHeight;
  if (!bw || !bh) return;
  var bx = el.offsetLeft, by = el.offsetTop;
  var i = flip.getCurrentPageIndex();

  /* the mirror and the centring slide share one transform on #book, so the
     decorations (which are siblings, not children) get the slide added by hand */
  var off = offsetFor(i);
  el.style.transform = 'translateX(' + off + 'px) scaleX(-1)';

  /* bounds of what is actually visible, not of the two-page block */
  var vx = bx + off, vw = bw;
  if (aloneAt(i)) {
    vw = bw / 2;
    if (i !== 0) vx += bw / 2;   // mirrored: the cover lands on the left half
  }

  /* Heyzine layers a second, spread-wide ambient shadow on top of the per-page
     one, which is what gives the book its heavier outer contour. */
  var fx = document.getElementById('spreadfx');
  fx.style.left = vx + 'px';
  fx.style.top = by + 'px';
  fx.style.width = vw + 'px';
  fx.style.height = bh + 'px';

  var c = document.getElementById('contact');
  c.style.width = (vw * 1.06) + 'px';
  c.style.height = Math.round(bh * 0.07) + 'px';
  c.style.left = (vx + vw / 2 - vw * 0.53) + 'px';
  c.style.top = (by + bh - 6) + 'px';

  var g = document.getElementById('gutter');
  if (portrait || aloneAt(i)) { g.style.opacity = 0; }
  else {
    var gw = Math.round(bw * 0.085);
    g.style.opacity = .9;
    g.style.height = bh + 'px';
    g.style.top = by + 'px';
    g.style.width = gw + 'px';
    g.style.left = (bx + off + (bw - gw) / 2) + 'px';
  }

  /* Corner-peel hints, mirroring the edge arrows: "next" hugs the left
     edge (RTL forward), "prev" the right edge, one peel per corner. */
  var PS = 34;
  var nb = document.getElementById('peelNextB'), nt = document.getElementById('peelNextT');
  var pb = document.getElementById('peelPrevB'), pt = document.getElementById('peelPrevT');
  nb.style.left = nt.style.left = vx + 'px';
  pb.style.left = pt.style.left = (vx + vw - PS) + 'px';
  nt.style.top = pt.style.top = by + 'px';
  nb.style.top = pb.style.top = (by + bh - PS) + 'px';
  var hasNext = i < total - 1, hasPrev = i > 0;
  nb.classList.toggle('hide', !hasNext); nt.classList.toggle('hide', !hasNext);
  pb.classList.toggle('hide', !hasPrev); pt.classList.toggle('hide', !hasPrev);

  /* Edge arrows sit OUTSIDE the page, like the reference, with a fixed gap -
     not pinned to the viewport edge, so they track the book at every size.
     Position and size measured directly off Heyzine's live reader via DOM
     inspection: 32x32 buttons, 10px gap outside the book's left/right edge,
     bottom-aligned so the button's bottom sits 5px above the book's own
     bottom edge (NOT vertical-middle - an earlier pass here wrongly assumed
     that from a screenshot instead of measuring the real DOM rects).
     On narrow/portrait viewports there often isn't 10+32px of margin outside
     the single page at all; without clamping, edgeNext lands at a negative
     x and is permanently off-screen and unusable (confirmed at 390px wide:
     x=-52). Clamp both buttons to stay on screen, falling back to overlapping
     the page edge slightly rather than disappearing. */
  var EGAP = 10, EB = 32, EPAD = 4, EBOTTOM = 5;
  var edgeNext = document.getElementById('edgeNext'), edgePrev = document.getElementById('edgePrev');
  var vpW = stage.clientWidth;
  edgeNext.style.left = Math.max(EPAD, vx - EGAP - EB) + 'px';
  edgeNext.style.top = (by + bh - EBOTTOM - EB) + 'px';
  edgePrev.style.left = Math.min(vx + vw + EGAP, vpW - EB - EPAD) + 'px';
  edgePrev.style.top = (by + bh - EBOTTOM - EB) + 'px';
  /* These buttons live inside #zoomwrap, so their left/top above is in that
     ancestor's pre-scale coordinate space; the clamp against vpW is only
     valid at zoom 1. Once #zoomwrap is scaled, the same clamped value can
     still land off-screen after magnification (confirmed at zoom 1.5:
     edgeNext computed x=-36). The bottom bar's prev/next already live
     outside #zoomwrap and stay reachable at any zoom, so simply hide these
     floating buttons while zoomed rather than chase scale-compensated math
     for a control whose whole purpose is being reliably clickable. */
  edgeNext.classList.toggle('hide', !hasNext || zoom !== 1);
  edgePrev.classList.toggle('hide', !hasPrev || zoom !== 1);
}

function updateCounter() {
  if (!flip) return;
  var i = flip.getCurrentPageIndex();
  var t;
  if (portrait || aloneAt(i)) t = 'עמוד ' + (i + 1) + ' מתוך ' + total;
  /* isolate the range so bidi does not print 4-5 as 5-4 */
  else t = 'עמודים \u2066' + (i + 1) + '\u2013' + (i + 2) + '\u2069 מתוך ' + total;
  document.getElementById('counter').textContent = t;
  document.getElementById('btnPrev').disabled = (i <= 0);
  document.getElementById('btnNext').disabled = (i >= total - 1);
  document.getElementById('edgePrev').classList.toggle('hide', i <= 0);
  document.getElementById('edgeNext').classList.toggle('hide', i >= total - 1);
  var s = document.getElementById('scrub');
  if (!scrubbing) s.value = i + 1;
}

function nextPage() { if (flip) flip.flipNext(); }
function prevPage() { if (flip) flip.flipPrev(); }

/* ---------------- scrubber ---------------- */
var scrubbing = false, scrubTimer = null;

/* The spread that page p belongs to, as [rightPage, leftPage] in reading order.
   StPageFlip pairs as [0] [1,2] [3,4]..., so evens open a spread. */
function spreadOf(p) {
  var i = p - 1;
  if (portrait || aloneAt(i)) return [p, 0];
  var a = (i % 2 === 0) ? i : i - 1;
  if (a === 0) return [1, 0];
  return [a + 1, a + 2];
}

function showPrev(p) {
  var box = document.getElementById('scrubprev');
  var pair = spreadOf(p), list = srcs(edition);
  var L = document.getElementById('spL'), R = document.getElementById('spR');
  /* RTL: the lower page number sits on the right */
  var hi = pair[1], lo = pair[0];
  if (hi && list[hi - 1]) { L.src = list[hi - 1]; L.style.display = ''; }
  else { L.style.display = 'none'; }
  R.src = list[lo - 1];
  box.querySelector('.lbl').textContent =
    hi ? (lo + ' - ' + hi) : String(lo);
  box.classList.add('on');
  var s = document.getElementById('scrub');
  var r = s.getBoundingClientRect();
  var frac = (p - 1) / Math.max(1, total - 1);
  /* the track runs RTL, so page 1 is at the right end */
  var x = r.right - frac * r.width;
  var w = box.offsetWidth || 204;
  box.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, x - w / 2)) + 'px';
}

function hidePrev() { document.getElementById('scrubprev').classList.remove('on'); }

(function () {
  var s = document.getElementById('scrub');
  s.addEventListener('pointerdown', function () { scrubbing = true; showPrev(parseInt(s.value, 10)); });
  s.addEventListener('input', function () {
    var p = parseInt(s.value, 10);
    document.getElementById('counter').textContent = 'עמוד ' + p + ' מתוך ' + total;
    showPrev(p);
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(function () {
      if (flip) { flip.turnToPage(p - 1); sync(); }
    }, 90);
  });
  s.addEventListener('change', function () {
    scrubbing = false;
    hidePrev();
    if (flip) { flip.turnToPage(parseInt(s.value, 10) - 1); sync(); }
  });
  window.addEventListener('pointerup', function () { if (scrubbing) { scrubbing = false; hidePrev(); } });
})();

/* ---------------- zoom ---------------- */
var ZOOMS = [0.75, 1, 1.25, 1.5, 2, 2.5];
function zoomBy(dir) {
  var idx = ZOOMS.indexOf(zoom);
  if (idx < 0) idx = 1;
  idx = Math.max(0, Math.min(ZOOMS.length - 1, idx + dir));
  setZoom(ZOOMS[idx]);
}
function setZoom(z) {
  zoom = z;
  wrap.style.transform = 'scale(' + z + ')';
  document.getElementById('zlabel').textContent = Math.round(z * 100) + '%';
  stage.classList.toggle('zoomed', z > 1);
  if (z > 1) setTimeout(centreScroll, 260);
  layout();   // re-evaluate edge-arrow visibility now that zoom has changed
}
/* In RTL, scrollLeft runs from 0 at the right edge to a negative minimum. */
function centreScroll() {
  var overX = stage.scrollWidth - stage.clientWidth;
  var overY = stage.scrollHeight - stage.clientHeight;
  var rtl = getComputedStyle(stage).direction === 'rtl';
  stage.scrollTop = overY / 2;
  stage.scrollLeft = rtl ? -(overX / 2) : (overX / 2);
}
(function () {
  var down = false, sx = 0, sy = 0, sl = 0, st = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (zoom <= 1 || e.target.closest('#book')) return;
    down = true; sx = e.clientX; sy = e.clientY;
    sl = stage.scrollLeft; st = stage.scrollTop;
  });
  window.addEventListener('pointermove', function (e) {
    if (!down) return;
    stage.scrollLeft = sl - (e.clientX - sx);
    stage.scrollTop = st - (e.clientY - sy);
  });
  window.addEventListener('pointerup', function () { down = false; });
})();
stage.addEventListener('wheel', function (e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* Corner peels reveal by continuous proximity to the mouse, not by hover on
   the small 34px box itself - relying only on pointerenter/pointerleave on
   an element that small can desync if the cursor moves quickly (leave fires
   late or not at all), leaving the wrong corner stuck visible. Recomputing
   from scratch on every mousemove is self-correcting: whichever corner is
   nearest right now is the one shown, full stop.

   Listens on `document`, not `#stage`: the top two corners sit directly
   behind the #tools and #titlecard chrome panels, which are DOM siblings of
   #stage (both live under <body>), not descendants. When the browser's hit-
   test picks one of those panels as the topmost element at a point, a
   'pointermove' fired there bubbles through THAT panel's ancestor chain and
   never reaches a listener on #stage at all - confirmed with an instrumented
   single-jump test (moveCount stayed 0 landing directly on a chrome panel).
   The visible symptom was exactly the reported bug: resting the cursor over
   the tools panel (which visually overlaps the top-left corner) or the
   title card (overlaps the top-right corner) left whatever peel was last
   computed while genuinely over #stage stuck showing on the opposite side.
   Listening on `document` catches every pointermove regardless of which
   element is topmost, so proximity is evaluated everywhere, including over
   the chrome. */
var PEEL_RADIUS = 90;
document.addEventListener('pointermove', function (e) {
  var ids = ['peelNextB', 'peelNextT', 'peelPrevB', 'peelPrevT'];
  var nearest = null, nearestD = PEEL_RADIUS;
  for (var k = 0; k < ids.length; k++) {
    var el = document.getElementById(ids[k]);
    if (el.classList.contains('hide')) continue;
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var d = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (d < nearestD) { nearestD = d; nearest = ids[k]; }
  }
  for (var j = 0; j < ids.length; j++) {
    document.getElementById(ids[j]).classList.toggle('show', ids[j] === nearest);
  }
});
/* document doesn't fire 'pointerleave' the way an element does; 'pointerout'
   with relatedTarget null is what actually signals the cursor left the
   whole browser viewport (vs. moving onto another in-page element, which
   the per-move nearest-corner computation above already handles fine on
   its own - if nothing is within PEEL_RADIUS, nothing shows). */
document.addEventListener('pointerout', function (e) {
  if (e.relatedTarget !== null) return;
  ['peelNextB', 'peelNextT', 'peelPrevB', 'peelPrevT'].forEach(function (id) {
    document.getElementById(id).classList.remove('show');
  });
});

function setEdition(ed) {
  if (ed === edition) return;
  /* Both editions reflow the exact same 750 paragraphs at a different font
     size, so there is no saved paragraph->page ground truth to switch on
     exactly. Carrying the reader's fractional position through the page-
     count ratio keeps them in the same neighbourhood of the book instead of
     bouncing back to the cover - close, if not always the identical
     paragraph, and never a regression from a hard reset. */
  var oldTotal = total, oldPage = flip ? flip.getCurrentPageIndex() + 1 : 1;
  edition = ed;
  document.getElementById('ed-regular').classList.toggle('on', ed === 'regular');
  document.getElementById('ed-large').classList.toggle('on', ed === 'large');
  var l = document.getElementById('load');
  l.classList.remove('done');
  document.querySelector('#pbar i').style.width = '0';
  warm(srcs(ed), 4, function () {
    var newTotal = EDITIONS[ed].pages;
    /* fraction through the book, 0-indexed, applied identically to the new
       edition's page count. Using oldPage instead of (oldPage-1) here would
       shift the cover (page 1) to page 2 - the fraction must be 0 at the
       very first page in both editions. */
    var target = oldTotal > 1
      ? Math.round((oldPage - 1) * (newTotal - 1) / (oldTotal - 1)) + 1
      : 1;
    target = Math.max(1, Math.min(newTotal, target));
    build(target); setZoom(1);
    l.classList.add('done');
  });
  try { localStorage.setItem('hb_ed', ed); } catch (e) {}
}

function toggleFullscreen() {
  var d = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  }
}

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') prevPage();
  if (e.key === 'ArrowLeft') nextPage();
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === '+' || e.key === '=') zoomBy(1);
  if (e.key === '-' || e.key === '_') zoomBy(-1);
  if (e.key === '0') setZoom(1);
});

var rt;
window.addEventListener('resize', function () {
  clearTimeout(rt);
  rt = setTimeout(function () {
    var cur = flip ? flip.getCurrentPageIndex() + 1 : 1;
    build(cur);
  }, 200);
});

try {
  var saved = localStorage.getItem('hb_ed');
  if (saved && EDITIONS[saved]) {
    edition = saved;
    document.getElementById('ed-regular').classList.toggle('on', saved === 'regular');
    document.getElementById('ed-large').classList.toggle('on', saved === 'large');
  }
} catch (e) {}

warm(srcs(edition), 4, function () {
  build(1);
  initSound();
  document.getElementById('load').classList.add('done');
});
</script>
</body>
</html>
